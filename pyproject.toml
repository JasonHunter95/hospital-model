[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hospital-model"
version = "0.1.0"
description = "Age-structured SEIXHRD epidemic model with healthcare capacity constraints"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Jason Hunter"}
]
keywords = ["epidemiology", "compartmental-model", "ODE", "healthcare-capacity", "vaccination"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "numpy>=1.24.3",
    "scipy>=1.11.2",
    "sympy>=1.12.1",
    "matplotlib>=3.8.2",
    "pandas>=2.2.0",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
viz = ["manim>=0.16.0"]
notebooks = ["jupyter>=1.0.0"]
dev = [
    "pytest>=8.3.4",
    "pytest-xdist>=3.2.2",
    "pytest-cov>=5.2.1",
]
all = ["hospital-model[viz,notebooks,dev]"]

[project.urls]
Repository = "https://github.com/JasonHunter95/hospital-model"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-n auto"
